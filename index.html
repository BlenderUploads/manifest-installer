<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifest — Mass Linux App Installer</title>
<meta name="description" content="Check the boxes. Get one script. Install everything at once — inspired by Ninite and Linite.">
<style>
  :root{
    --bg:#10131a;
    --panel:#171b24;
    --panel-2:#1d2230;
    --border:#2a2f3d;
    --text:#e9e7df;
    --muted:#8d93a3;
    --amber:#d9a441;
    --amber-dim:#8a6b2c;
    --teal:#5fb3a3;
    --danger:#e2725b;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(217,164,65,0.06), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(95,179,163,0.05), transparent 45%);
  }
  a{color:var(--teal);}
  ::selection{background:var(--amber);color:#10131a;}

  /* ---------- header ---------- */
  header{padding:56px 24px 32px;max-width:1080px;margin:0 auto;}
  .eyebrow{font-family:var(--mono);color:var(--amber);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"$";color:var(--muted);}
